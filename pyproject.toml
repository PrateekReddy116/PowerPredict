[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "ml", "iot", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/alembic/*" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["tests"]
